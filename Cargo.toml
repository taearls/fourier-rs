[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/audio-io",
    "crates/midi",
    "crates/engine",
    "crates/ffi",
    "examples/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# DSP
rustfft = "6.2"
realfft = "3.4"

# Audio I/O
cpal = "0.15"

# MIDI
midir = "0.10"

# Lock-free communication
ringbuf = "0.4"
crossbeam-channel = "0.5"

# Numeric
num-complex = "0.4"
num-traits = "0.2"

# Workspace crates
fourier-core = { path = "crates/core" }
fourier-audio-io = { path = "crates/audio-io" }
fourier-midi = { path = "crates/midi" }
fourier-engine = { path = "crates/engine" }
fourier-ffi = { path = "crates/ffi" }

[workspace.lints.rust]
unsafe_code = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Pedantic overrides — allow these common patterns
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
float_cmp = "allow"
